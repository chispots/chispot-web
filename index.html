<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chispot — Coming Soon</title>
    <meta name="description" content="Launching soon on iOS and Android." />
    <meta name="theme-color" content="#339AF0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chispot" />
    <meta property="og:title" content="Chispot — Coming Soon" />
    <meta
      property="og:description"
      content="Launching soon on iOS and Android."
    />
    <meta property="og:url" content="https://chispots.com/" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" aria-label="Chispot home">
          <span class="brand-badge">
            <img src="logo.png" alt="" />
          </span>
          Chispot
        </a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrap">
          <span class="eyebrow"><span class="dot"></span>Coming soon</span>

          <h1><span class="accent">Chispot</span> - Coming Soon</h1>

          <p class="lede">Launching on iOS and Android.</p>

          <!-- STORE SLOT — at launch, replace this block with the App Store and
               Google Play badges linking to the live listings. -->
          <div class="stores">
            <a
              class="cta"
              href="mailto:admin@chispots.com?subject=Notify%20me%20when%20Chispot%20launches"
              >Get notified</a
            >
            <span class="store-note">iOS &amp; Android · 2026</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="row">
          <span>© 2026 Chispot Inc.</span>
          <span class="sep">·</span>
          <span>Ottawa, Canada</span>
          <span class="sep">·</span>
          <a href="mailto:admin@chispots.com">admin@chispots.com</a>
          <!-- LAUNCH SLOT — terms.html, privacy.html and support.html are
               deployed (the app opens them, and App Review will tap them) but
               deliberately not linked from the marketing site while it is still
               a coming-soon page. At launch, restore the links here and delete
               the `robots: noindex` meta from all three:
                 <span class="sep">·</span><a href="terms.html">Terms</a>
                 <span class="sep">·</span><a href="privacy.html">Privacy</a>
                 <span class="sep">·</span><a href="support.html">Support</a>
               Safe to leave unlinked for now because this page collects
               nothing — no forms, no analytics, and "Get notified" is a plain
               mailto hand-off to the visitor's own email client. -->
        </div>
      </div>
    </footer>
  </body>
</html>
